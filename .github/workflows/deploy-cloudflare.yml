name: Deploy EdgeEver to Cloudflare

# Fork-local deploy pipeline.
#
# Why this exists: Cloudflare's own Workers Builds engine is unavailable for this
# account (API responds `12052 Your account is blocked from using Workers
# Builds`), so the build + `wrangler deploy` runs here on a GitHub runner
# instead. The deployment itself is unchanged: same Worker `edgeever`, same D1
# (`edgeever`), same R2 bucket (`edgeever-resources`), same runtime secret.
#
# Triggering: manual dispatch, daily schedule, and pushes to main that are NOT
# produced by GITHUB_TOKEN (the upstream updater pushes with GITHUB_TOKEN, and
# such pushes deliberately do not start other workflows — hence the schedule).

on:
  workflow_dispatch:
  schedule:
    # 03:37 UTC daily — after the updater (02:17 UTC) has aligned `main`.
    - cron: "37 3 * * *"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: edgeever-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EDGE_EVER_USE_EXISTING_AUTH_SECRET: "true"
      EDGE_EVER_WORKER_NAME: edgeever
      EDGE_EVER_WORKERS_DEV: "true"
      EDGE_EVER_D1_DATABASE_NAME: edgeever
      EDGE_EVER_D1_DATABASE_ID: a487f6e9-9bbd-4889-8e62-ddd5d9e377ce
      EDGE_EVER_R2_BUCKET_NAME: edgeever-resources
      EDGE_EVER_R2_PREVIEW_BUCKET_NAME: edgeever-resources-preview
      EDGE_EVER_AUTH_USERNAME: knight
      EDGE_EVER_SESSION_TTL_DAYS: "400"
      EDGE_EVER_CUSTOM_DOMAIN: edgeever.paaaasd.ccwu.cc
      EDGE_EVER_DEPLOYMENT_URL: https://edgeever.paaaasd.ccwu.cc
      EDGE_EVER_DEPLOYMENT_TRIGGER: main_push
      EDGE_EVER_DEPLOYMENT_METHOD: github_actions

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web assets and the Worker bundle
        run: bun run build:cloudflare

      - name: Migrate D1, deploy the Worker, verify it live
        run: bun run deploy:cloudflare-builds